# Builds the game and publishes it on GitHub Pages (https://<owner>.github.io/<repository>/).
# Run by hand: Actions → "Deploy to GitHub Pages" → Run workflow. Needs Pages enabled once, with
# "GitHub Actions" as its source (Settings → Pages). Only the municipalities listed in
# app/public/data/index.json ship (vite.config.ts). The Feedback button's address comes from the
# repository variable FEEDBACK_EMAIL, the GoatCounter site code (anonymous usage counts) from
# GOATCOUNTER_CODE.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Where the Feedback button's email goes: the repository variable FEEDBACK_EMAIL
          # (Settings → Secrets and variables → Actions → Variables). Without it, players copy the report.
          VITE_FEEDBACK_EMAIL: ${{ vars.FEEDBACK_EMAIL }}
          # The GoatCounter site code (the "xyz" of xyz.goatcounter.com): the repository variable
          # GOATCOUNTER_CODE. Without it, nothing is counted.
          VITE_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
