# Commune Zéro's leaderboard (README.md). Deploy from this folder: npx wrangler deploy
name = "commune-zero-leaderboard"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# The game's addresses (its domain, and GitHub Pages' own, which forwards there) and the dev
# server — the only pages allowed to call.
[vars]
ALLOWED_ORIGINS = "https://commune-zero.ch,https://www.commune-zero.ch,https://wildsolar.github.io,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "commune-zero-leaderboard"
# Filled in from the output of: npx wrangler d1 create commune-zero-leaderboard
database_id = "e9a15c38-a8fb-421c-85be-599ef2989b34"
